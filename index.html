    <meta charset="UTF-8" />

    <meta property="og:title" content="Apex Terminal - Bloomberg-Grade Financial Intelligence" />
    <meta property="og:description" content="Institutional-grade financial terminal with comprehensive global market dashboard, multi-asset class benchmarks, S&P 500 sector heatmaps, domestic & global economic indicators (GDP, imports/exports trade data), real-time stock ticker, 5-year audited financial statements, and AI quantitative analysis." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('closed without opened') || (e.reason && e.reason.stack && e.reason.stack.includes('@vite/client'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e.message || '') + (e.filename || '');
        if (msg.includes('WebSocket') || msg.includes('closed without opened') || (e.filename && e.filename.includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#0c0d0e] text-[#e0e2ec] font-sans antialiased overflow-hidden select-none">
    <div id="root" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
